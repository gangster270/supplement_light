# =====================================================================
# 실험 사이트 파라미터
# =====================================================================
# 이 파일 하나만 고치면 다른 구역/다른 목표로 재실행할 수 있어야 한다.
# 코드에는 사이트 상수를 하드코딩하지 않는다.
#
# ★ verified: false 인 그룹은 아직 연구자 확인을 받지 않은 임시값이다.
#   프로그램이 실행은 되지만 UI/CLI에 "미확정 파라미터" 경고를 띄운다.
#   실제 판단에 쓰기 전에 반드시 실측/확인 값으로 바꾸고 verified: true 로 변경할 것.
# =====================================================================

site:
  name: "실험 사이트"            # TODO(P0): 실제 온실 명칭
  crop: "잎들깨"                 # TODO(P0): 대상 작물 확인
  timezone: "Asia/Seoul"
  interval_minutes: 10           # 로거 측정 간격

# ---------------------------------------------------------------------
# 온실 - 구역 - 처리구 매핑
# ---------------------------------------------------------------------
# TODO(P0): 아래는 구조 예시일 뿐이다. 실제 매핑을 연구자에게 확인해서 교체할 것.
#   - 어느 구역들이 "같은 온실"인지 (투과율은 온실 단위로 산출된다)
#   - 각 구역의 처리 (NI / NI+SL / 무처리 등)
#   - 온실별 기준 구역(reference) 1개 — 형제 구역 보정의 기준
greenhouses:
  verified: false
  items:
    - id: gh1
      name: "1온실"
      zones:
        - id: gh1_ni
          name: "1구역 (NI)"
          treatment: "NI"
          reference: true
          source: { logger_id: "z6-11111", ppfd_column: "PPFD" }
        - id: gh1_ni_sl
          name: "2구역 (NI+SL)"
          treatment: "NI+SL"
          reference: false
          source: { logger_id: "z6-11112", ppfd_column: "PPFD" }
    - id: gh2
      name: "2온실"
      zones:
        - id: gh2_ni
          name: "3구역 (NI)"
          treatment: "NI"
          reference: true
          source: { logger_id: "z6-22221", ppfd_column: "PPFD" }
        - id: gh2_ni_sl
          name: "4구역 (NI+SL)"
          treatment: "NI+SL"
          reference: false
          source: { logger_id: "z6-22222", ppfd_column: "PPFD" }

# ---------------------------------------------------------------------
# 외부(대조) PPFD 데이터
# ---------------------------------------------------------------------
external:
  # 농업기술원/기상관측소 퀀텀센서. 투과율 산출과 청천지수 계산의 기준이 된다.
  ppfd_column: "퀀텀센터"        # 컬럼명 부분일치 키워드
  night_threshold: 2.0           # 이 값 미만이면 "순수 야간"(자연광 없음)으로 간주
  daylight_threshold: 50.0       # 투과율 산출 시 노이즈 배제용 하한

# ---------------------------------------------------------------------
# 보광 설비
# ---------------------------------------------------------------------
lamp:
  verified: false                # TODO(P0): 아래 3개 값 모두 실측 확인 필요
  power_w_per_fixture: 100.0     # 등기구 1대 소비전력 (W)
  fixtures_per_zone: 20          # 구역당 설치 대수
  # ★ 가장 중요한 미확정값: 점등 시 구역 평균 PPFD 기여량.
  #   야간 순수 LED 구간(외부 PPFD < night_threshold)의 실측 평균에서 산출할 수 있다.
  #   metrics.night_baseline() 로 계산 후 이 값을 갱신할 것.
  ppfd_contribution: 60.0        # µmol·m⁻²·s⁻¹

# ---------------------------------------------------------------------
# NI (야간중단) 스케줄 — 실험 처리 조건. 판단 엔진이 절대 덮어쓰지 않는다.
# ---------------------------------------------------------------------
ni:
  verified: false                # TODO(P0): 정확한 시작/종료 시각과 경계 포함 여부 확인
  enabled: true
  start: "18:30"
  end: "02:30"                   # 자정을 넘어가는 구간 (wrap) 으로 해석된다
  include_start: true
  include_end: true
  # NI가 적용되는 처리구. 여기에 없는 처리구는 NI 강제 점등 대상이 아니다.
  treatments: ["NI", "NI+SL"]

# ---------------------------------------------------------------------
# 판단 기준
# ---------------------------------------------------------------------
decision:
  verified: false                # TODO(P0): 목표 DLI와 임계값은 작물·생육단계 기준으로 확인
  target_dli: 12.0               # mol·m⁻²·d⁻¹
  on_threshold: 150.0            # 이 값 미만이면 점등 후보 (µmol·m⁻²·s⁻¹)
  off_threshold: 250.0           # 이 값 초과여야 소등 — on/off 임계 분리 = 히스테리시스
  moving_average_minutes: 30     # 순간값이 아닌 이동평균으로 판단 (구름 통과 대응)
  min_on_minutes: 30             # 최소 점등 유지시간
  min_off_minutes: 30            # 최소 소등 유지시간
  # 일일 최대 점등시간 상한. NI 는 강제 점등이므로 이 상한을 먼저 소진한다는 점에 주의.
  # NI 18:30~02:30 은 달력일 기준 약 8.2시간을 이미 쓰므로, 재량 보광 여유를 두려면
  # 그보다 충분히 크게 잡아야 한다 (설정이 어긋나면 로드 시 경고가 뜬다).
  max_daily_lighting_hours: 12.0
  max_photoperiod_hours: 16.0    # 최대 광주기 상한 (자연광 + 보광)
  # 보광 허용 시간대. 이 밖에서는 (NI를 제외하고) 점등하지 않는다.
  allowed_windows:
    - "04:00-08:00"
    - "15:00-22:00"
  # 부족분을 못 채우게 되기까지의 여유. slack이 이 값 이하로 떨어지면 "지금 켜야 함".
  urgency_margin_hours: 0.5

# ---------------------------------------------------------------------
# 잔여 자연광 예측
# ---------------------------------------------------------------------
forecast:
  mode: "standard"               # conservative | standard | aggressive
  mode_factors:                  # 예측 자연광에 곱하는 계수
    conservative: 0.75           # 자연광을 적게 잡음 → 더 자주 점등 (안전)
    standard: 1.0
    aggressive: 1.25             # 자연광을 많이 잡음 → 덜 점등 (전기 절약)
  clear_sky_quantile: 0.9        # 청천 기준선을 만들 상위 분위수
  doy_window_days: 15            # 청천 프로파일 산출 시 전후 며칠을 함께 볼지
  min_clearness_samples: 6       # 청천지수 계산에 필요한 최소 측정 수
  # 이른 아침에는 청천 기준 적산이 작아 분모가 조금만 흔들려도 청천지수가 폭발한다.
  # 기준 적산이 이 값(mol·m⁻²) 미만이면 청천지수를 계산하지 않고 '불확실'로 처리한다.
  min_reference_dli: 0.5

# ---------------------------------------------------------------------
# 전기요금 (P4에서는 저가 시간대 배치 판단에만 사용. 상세 정산은 P7)
# ---------------------------------------------------------------------
tariff:
  verified: false                # TODO(P0): 농사용 전력 종별·계시별 단가 확인
  currency: "KRW"
  seasons:
    - name: "여름철"
      months: [6, 7, 8]
      slots:
        - { name: "경부하",   hours: "23:00-09:00", won_per_kwh: 60.0 }
        - { name: "중간부하", hours: "09:00-10:00", won_per_kwh: 90.0 }
        - { name: "최대부하", hours: "10:00-12:00", won_per_kwh: 130.0 }
        - { name: "중간부하", hours: "12:00-13:00", won_per_kwh: 90.0 }
        - { name: "최대부하", hours: "13:00-17:00", won_per_kwh: 130.0 }
        - { name: "중간부하", hours: "17:00-23:00", won_per_kwh: 90.0 }
    - name: "봄가을철"
      months: [3, 4, 5, 9, 10]
      slots:
        - { name: "경부하",   hours: "23:00-09:00", won_per_kwh: 60.0 }
        - { name: "중간부하", hours: "09:00-23:00", won_per_kwh: 80.0 }
    - name: "겨울철"
      months: [11, 12, 1, 2]
      slots:
        - { name: "경부하",   hours: "23:00-09:00", won_per_kwh: 65.0 }
        - { name: "중간부하", hours: "09:00-10:00", won_per_kwh: 95.0 }
        - { name: "최대부하", hours: "10:00-12:00", won_per_kwh: 125.0 }
        - { name: "중간부하", hours: "12:00-17:00", won_per_kwh: 95.0 }
        - { name: "최대부하", hours: "17:00-20:00", won_per_kwh: 125.0 }
        - { name: "중간부하", hours: "20:00-23:00", won_per_kwh: 95.0 }

# ---------------------------------------------------------------------
# 데이터 위치
# ---------------------------------------------------------------------
data:
  logger_dir: "data/logger"      # ZL6 export (.xlsx/.csv) 를 넣는 폴더
  external_dir: "data/external"  # 외부 PPFD 파일 폴더
